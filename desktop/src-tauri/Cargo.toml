[package]
name = "bridge-desktop"
version = "0.7.5"
edition = "2021"
rust-version = "1.98.1"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]
qualification-tools = []

[[bin]]
name = "Bridge"
path = "src/main.rs"

[[bin]]
name = "brain-fixture"
path = "tests/fixtures/brain.rs"
required-features = ["qualification-tools"]
test = false

[[bin]]
name = "prerequisite-fixture"
path = "tests/fixtures/prerequisite.rs"
required-features = ["qualification-tools"]
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[dependencies]
quick-xml = "=0.42.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = "1"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
dotenvy = "0.15"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-runtime = { package = "windows", version = "=0.62.2", features = [
  "ApplicationModel", "Foundation", "Management_Deployment", "System", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell"
] }
windows-future = "=0.3.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock",
  "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Console", "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Networking_WinHttp",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
