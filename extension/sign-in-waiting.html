<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="popup.css">
<style>
  html, body { width: 100%; height: 100%; min-width: 0; max-width: none; margin: 0; }
  body.sign-in-waiting { min-height: 100vh; height: auto; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 24px;
    text-align: center; background: var(--dipsy-intent-surface-canvas); color: var(--dipsy-intent-text-primary); font-family: var(--dipsy-font-family-ui); }
  .waiting-status { margin: 0; color: var(--dipsy-intent-text-primary); font-size: var(--dipsy-static-body-size); }
  .waiting-arc { display: block; width: 28px; height: 28px; color: var(--dipsy-color-primary); animation: waiting-pending 1s linear infinite; }
  @keyframes waiting-pending { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .waiting-arc { animation: none; } }
</style>
</head>
<body class="sign-in-waiting">
<svg class="waiting-arc" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="33.5 50.3"></circle></svg>
<p class="waiting-status" role="status">Opening sign-in…</p>
</body>
</html>
