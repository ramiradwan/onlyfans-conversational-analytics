<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="popup.css">
<style>
  html, body { width: 100%; height: 100%; min-width: 0; max-width: none; margin: 0; }
  body.sign-in-waiting { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--dipsy-intent-surface-canvas); color: var(--dipsy-intent-text-primary); font-family: var(--dipsy-font-family-ui); }
  .waiting-status { margin: 0; color: var(--dipsy-intent-text-primary); font-size: 14px; }
  .waiting-arc { width: 28px; height: 28px; border: 3px solid var(--dipsy-color-divider); border-right-color: var(--dipsy-color-primary);
    border-radius: 50%; animation: waiting-pending 1s linear infinite; }
  @keyframes waiting-pending { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .waiting-arc { animation: none; } }
</style>
</head>
<body class="sign-in-waiting">
<div class="waiting-arc" aria-hidden="true"></div>
<p class="waiting-status" role="status">Opening sign-in…</p>
</body>
</html>
