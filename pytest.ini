[pytest]
testpaths = tests
asyncio_mode = auto
strict_markers = true
addopts = -p no:cacheprovider -m "not slow and not stateful_tier_a and not stateful_tier_b and not stateful_agent_tier_a"
markers =
    ci_tier(name): explicit CI owner: fast, integration, scale, or stateful; nearest declaration overrides the module default
    windows_compat: reviewed Windows-sensitive behavior with a positive Windows contract selection
    serial: owns process or machine resources and must execute without concurrent pytest workers on the same runner
    contract_integrity: selected vendored contract bytes, consumer pin, and trust refusal
    slow: heavyweight or timing-sensitive scale tests excluded from the default tier
    external_default_scope: writes a temporary repository marker directly under the system drive
    windows_production: boots production persistence and therefore requires Windows DPAPI
    stateful_tier_a: generated in-memory semantic assurance selected explicitly in CI
    stateful_tier_b: file-backed restart assurance selected explicitly on the fixed Windows runtime
    stateful_agent_tier_a: persistent Node Agent delivery assurance selected explicitly in CI
