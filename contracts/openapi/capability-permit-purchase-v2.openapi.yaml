openapi: 3.1.0
info:
  title: Session-bound native single-permit purchase sandbox
  version: 2.0.0
paths:
  /v2/capability-permit-purchases:prepare:
    post:
      operationId: prepareCapabilityPermitPurchaseV2
      summary: Bounded native prepare for a single-execution permit
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commercial/v2/capability-permit-purchase-prepare-request.schema.json
      responses:
        '200':
          description: Exact operation projection or committed result
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v2/capability-permit-purchase-view-response.schema.json
        '400':
          description: Closed schema invalid
        '401':
          description: Fresh exact registered-key proof invalid
        '403':
          description: Current authority unavailable
        '409':
          description: Operation state or immutable terms conflict
        '429':
          description: Rate limited
        '503':
          description: Temporarily unavailable; no success implied
