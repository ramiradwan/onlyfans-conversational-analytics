paths:
  /v1/onboarding/browser-ceremony-proof-challenges:
    post:
      operationId: issueBrowserCeremonyProofChallenge
      summary: Issue an unauthorizing operation-bound challenge
      x-contract-profile: urn:bridge-clean:browser-ceremony-proof:v1
      x-max-request-bytes: 8192
      x-max-response-bytes: 16384
      x-authentication: uniform challenge; possession is not authority
      x-idempotency: proof replay refuses; fresh-proof exact operation retries reconcile
        original result without renewal
      x-rate-limit: bounded per source/key and ingress; 429 does not disclose existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/browser-ceremony/v1/proof-challenge-request.schema.json
      responses:
        '200':
          description: Exact closed response; no authority from navigation or notifications.
          content:
            application/json:
              schema:
                $ref: ../schemas/browser-ceremony/v1/proof-challenge-response.schema.json
        '400':
          description: Closed refusal; unknown and foreign operations disclose no
            source existence.
          content:
            application/json:
              schema:
                $ref: ../schemas/browser-ceremony/v1/error.schema.json
        '401':
          description: Closed refusal; unknown and foreign operations disclose no
