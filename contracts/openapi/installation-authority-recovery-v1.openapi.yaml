    "title": "Bridge Clean installation authority recovery v1 API",
    "version": "1.0.0",
    "description": "Protected recovery of an exact enrolled installation after ordinary renewal eligibility ends. Preparation creates no authority. Customer authentication and issuance remain with their existing owners; delivery returns only already committed grant claims."
  },
