openapi: 3.1.0
info:
  title: Bound browser authentication provider selection
  version: 2.0.0
paths:
  /v1/onboarding/browser-authentication-selection-proof-challenges:
    post:
      operationId: issueBrowserAuthenticationSelectionProofChallengeV2
      x-contract-profile: urn:bridge-clean:browser-authentication-selection-proof:v2
      x-max-request-bytes: 8192
      x-max-response-bytes: 16384
      x-authentication: Uniform nonauthorizing challenge.
      x-idempotency: No authority renewal; exact child/predecessor/choice operation
        preserves original meaning and deadline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/browser-authentication-selection/v2/proof-challenge-request.schema.json
      responses:
        '200':
          description: Exact closed authentication selection projection; no customer
            credentials or commercial result.
          content:
            application/json:
              schema:
                $ref: ../schemas/browser-authentication-selection/v2/proof-challenge-response.schema.json
        '400':
          description: Closed refusal without unknown-source existence disclosure.
          content:
            application/json:
              schema:
                $ref: ../schemas/browser-authentication-selection/v2/error.schema.json
        '413':
          description: Closed refusal without unknown-source existence disclosure.
          content:
            application/json:
