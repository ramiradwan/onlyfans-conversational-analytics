openapi: 3.1.0
info:
  title: Recovery of already committed activation delivery
  version: 1.0.0
paths:
  /v1/capability-license-delivery-recovery-proof-challenges:
    post:
      operationId: issueCapabilityLicenseDeliveryRecoveryProofChallenge
      summary: Issue a uniform nonauthorizing exact-request challenge
      x-contract-profile: urn:bridge-clean:capability-license-delivery-recovery-proof:v1
      x-max-request-bytes: 4096
      x-max-response-bytes: 4096
      x-authentication: Uniform nonauthorizing challenge allocation; no proof, customer
        admission or source-existence disclosure is created by this response.
      x-idempotency: Bounded fresh single-use challenge only; no delivery generation
        or accepted recovery result is created.
      x-rate-limit: Existing bounded ingress and proof-challenge controls with uniform
        behavior for unknown, foreign and revoked scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-proof-challenge-request.schema.json
      responses:
        '200':
          description: Single-use exact-request challenge with a fixed lifetime of at most 60 seconds
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-proof-challenge-response.schema.json
        '400':
          description: Closed refusal; no authority from unknown or foreign scopes
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-error.schema.json
        '413':
          description: Closed refusal; no authority from unknown or foreign scopes
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-error.schema.json
        '429':
          description: Closed refusal; no authority from unknown or foreign scopes
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-error.schema.json
        '503':
          description: Closed refusal; no authority from unknown or foreign scopes
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-error.schema.json
