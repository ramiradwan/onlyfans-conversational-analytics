      x-max-request-bytes: 4096
      x-max-response-bytes: 4096
      x-authentication: Exact registered original installation-key proof; no customer/browser
        session authority. Challenge disclosure is uniform.
      x-idempotency: Noncreating current or exact-generation projection; does not
        allocate or renew any delivery authorization or recovery result.
      x-rate-limit: Existing bounded ingress and proof-challenge controls; reads do
        not spend a recovery creation slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-read-request.schema.json
      responses:
