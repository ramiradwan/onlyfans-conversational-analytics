  /v1/capability-license-delivery-recoveries:recover:
    post:
      operationId: recoverCapabilityLicenseDelivery
      summary: Authorize delivery of the same accepted activation at the exact next
        generation
      x-contract-profile: urn:bridge-clean:capability-license-delivery-recovery:v1
      x-max-request-bytes: 4096
      x-max-response-bytes: 4096
      x-authentication: Exact registered original installation-key proof; no customer/browser
        session authority. Challenge disclosure is uniform.
      x-idempotency: Original operation plus generation; exact accepted current result
        is byte/deadline stable, past generations never create; no Idempotency-Key
        header.
      x-rate-limit: At most one fresh authorization per rolling 600 seconds; bounded
        ingress and proof challenges; no lifetime limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-recover-request.schema.json
      responses:
        '200':
          description: Exact current-generation accepted retry with original response bytes and deadline
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/commercial/v1/capability-license-delivery-recovery-recover-response.schema.json
        '201':
          description: Atomically committed next-generation delivery authorization for the same original scope
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
