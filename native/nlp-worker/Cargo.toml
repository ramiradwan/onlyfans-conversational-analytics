[package]
name = "nlp-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[features]
default = []
instruction-topics = []

[build-dependencies]
cc = "=1.8.0"
sha2 = "0.11"

[dependencies]
anyhow = "1"
gliner2-rs = { path = "upstream" }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
