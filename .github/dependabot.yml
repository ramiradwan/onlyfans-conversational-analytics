version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /extension
      - /tools/e2e-capture
      - /tools/visual-capture
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    ignore:
      # extension/build.mjs audits the exact esbuild and fflate versions.
      - dependency-name: esbuild
      - dependency-name: fflate
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      routine-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
