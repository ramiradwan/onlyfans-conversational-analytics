version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    # tools/e2e-capture stays on Playwright 1.61.1. Its capture recovery test
    # fails on Chromium 153, which Playwright 1.63 installs.
    directories:
      - /frontend
      - /extension
      - /tools/visual-capture
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    ignore:
      # extension/build.mjs audits the exact esbuild and fflate versions.
      - dependency-name: esbuild
      - dependency-name: fflate
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      routine-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
