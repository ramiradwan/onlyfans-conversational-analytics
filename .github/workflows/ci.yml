name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_SHA }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/sqlcipher/fixed-runtime-sources.json

      - name: Check documentation
        run: python tools/check_docs.py

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Cache build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            frontend/.vite
            frontend/.swc
            frontend/.eslintcache
            frontend/tsconfig.tsbuildinfo
          key: build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install pinned native Noise toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install backend dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python -m pip install -r requirements-dev.txt

      - name: Run Brain Tier A general state machine
        env:
          HYPOTHESIS_PROFILE: tier_a_general
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_brain_ingestion.py::TestBrainIngestionGeneral
          -vv
          --hypothesis-show-statistics

      - name: Run Brain Tier A deletion state machine
        env:
          HYPOTHESIS_PROFILE: tier_a_deletion
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_brain_ingestion.py::TestBrainIngestionDeletion
          -vv
          --hypothesis-show-statistics

      - name: Run Agent Tier A general state machine
        env:
          HYPOTHESIS_PROFILE: agent_tier_a_general
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_agent_delivery.py::TestAgentDeliveryGeneral
          -vv

      - name: Run Agent Tier A deletion state machine
        env:
          HYPOTHESIS_PROFILE: agent_tier_a_deletion
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_agent_delivery.py::TestAgentDeliveryDeletion
          -vv

      - name: Run deterministic analytics rebuilds
        env:
          HYPOTHESIS_PROFILE: analytics_determinism_fast
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_analytics_determinism.py::TestAnalyticsDeterminism
          -vv
          --hypothesis-show-statistics

      - name: Run incremental analytics convergence
        env:
          HYPOTHESIS_PROFILE: analytics_convergence_fast
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_analytics_equivalence.py::TestAnalyticsConvergence
          -vv
          --hypothesis-show-statistics

      - name: Run derived deletion closure
        env:
          HYPOTHESIS_PROFILE: analytics_deletion_fast
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_analytics_equivalence.py::TestAnalyticsDeletionConvergence
          -vv
          --hypothesis-show-statistics

      - name: Run analytics oracle falsifiers
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_analytics_equivalence.py::test_analytics_convergence_falsifiers_reject_metric_provenance_identity_graph_and_deletion_faults
          tests/stateful/test_analytics_equivalence.py::test_shared_oracle_rejects_same_forged_topic_or_entity_graph_in_both_artifacts
          tests/stateful/test_analytics_equivalence.py::test_shared_oracle_rejects_same_stale_deleted_message_metric_in_both_artifacts
          tests/stateful/test_analytics_equivalence.py::test_active_publication_oracle_rejects_stale_deleted_material_with_current_witness
          tests/stateful/test_analytics_equivalence.py::test_deliberate_falsifier_failure_configures_hypothesis_shrink_phase
          -vv
          --hypothesis-show-statistics

      - name: Validate architecture boundary manifest
        run: python tools/validate_architecture_boundaries.py

      - name: Check protected architecture impact declaration
        if: github.event_name == 'pull_request'
        run: >
          python tools/check_boundary_declaration.py
          --event-path "$GITHUB_EVENT_PATH"
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Check Python architecture boundary contracts
        run: lint-imports

      - name: Verify selected contract snapshot integrity
        run: python -m pytest -m contract_integrity tests/test_contract_snapshot.py

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check Bridge architecture boundary contracts
        working-directory: frontend
        run: npm run check:architecture

      - name: Typecheck frontend design sync
        run: npm run typecheck:design-sync --prefix frontend

      - name: Check unused frontend files and dependencies
        working-directory: frontend
        run: npm run check:unused

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Check Agent architecture boundary contracts
        working-directory: extension
        run: npm run check:architecture

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Check committed theme artifacts against the generator
        run: git diff --exit-code -- frontend/src/theme/generated

      - name: Test backend
        run: >
          python -m pytest
          -m "not slow and not windows_production and not stateful_tier_a and not stateful_tier_b and not stateful_agent_tier_a"
          -vv
          --override-ini=faulthandler_timeout=120
          --durations=30

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Test extension
        run: npm test --prefix extension

      - name: Test provisioning page module
        run: node --test app/provisioning/provisioning.test.mjs

      - name: Test the release bindings gate
        run: node --test tools/legal-release-bindings/verify.test.mjs

      - name: Test the packaged signing rule gate
        run: node --test tools/packaged-signing-rule/verify.test.mjs

      - name: Build and audit deterministic extension artifact
        run: |
          npm run build --prefix extension
          npm run audit --prefix extension

      - name: Qualify bounded 10k-message snapshot repair
        run: npm run qualify:snapshot:ci --prefix extension

      - name: Upload frontend build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist-${{ env.PRODUCT_SHA }}
          path: app/static/dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload audited extension artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extension-dist-${{ env.PRODUCT_SHA }}
          path: extension/dist/
          retention-days: 7
          if-no-files-found: error

  fixed-sqlcipher-wheel:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Prepare native dependency cache
        id: native-cache
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "The hosted runner image version is required for the native dependency cache"
          }
          "image-version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "ofca-vcpkg-cache") | Out-Null

      - name: Cache native dependencies
        id: vcpkg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\ofca-vcpkg-cache
          key: ofca-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.image-version }}-${{ hashFiles('packaging/sqlcipher/fixed-runtime-sources.json', 'packaging/sqlcipher/build-fixed-wheel.py', 'packaging/sqlcipher/build-fixed-wheel.ps1') }}

      - name: Build fixed SQLCipher wheel
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\ofca-vcpkg-cache,readwrite
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "ofca-fixed-sqlcipher-wheelhouse"
          .\packaging\sqlcipher\build-fixed-wheel.ps1 `
            -BuildPython (Get-Command python.exe).Source `
            -Wheelhouse $wheelhouse

      - name: Record fixed SQLCipher CI source
        shell: pwsh
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "ofca-fixed-sqlcipher-wheelhouse"
          $payload = [ordered]@{
            schema_version = 1
            source_commit = $env:PRODUCT_SHA
            workflow_run_id = [long]$env:GITHUB_RUN_ID
            workflow_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
          }
          $payload | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $wheelhouse "ci-source.json")

      - name: Retain fixed SQLCipher wheel and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fixed-sqlcipher-wheel-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}\ofca-fixed-sqlcipher-wheelhouse\
          retention-days: 30
          if-no-files-found: error

  windows-tests:
    needs: fixed-sqlcipher-wheel
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Keep temporary test files on runner storage
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP "ofca-tests"
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          "TMPDIR=$testTemp", "TEMP=$testTemp", "TMP=$testTemp" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/sqlcipher/fixed-runtime-sources.json

      - name: Retrieve fixed SQLCipher wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fixed-sqlcipher-wheel-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}\ofca-fixed-sqlcipher-wheelhouse

      - name: Verify fixed SQLCipher CI source
        shell: pwsh
        run: |
          $source = Get-Content -Raw "$env:RUNNER_TEMP\ofca-fixed-sqlcipher-wheelhouse\ci-source.json" | ConvertFrom-Json
          if ($source.source_commit -ne $env:PRODUCT_SHA) { throw "Fixed SQLCipher source SHA mismatch" }
          if ([long]$source.workflow_run_id -ne [long]$env:GITHUB_RUN_ID) { throw "Fixed SQLCipher run ID mismatch" }

      - name: Declare fixed SQLCipher wheelhouse
        shell: pwsh
        run: |
          "SQLCIPHER_WHEELHOUSE=$env:RUNNER_TEMP\ofca-fixed-sqlcipher-wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install pinned native Noise toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install backend dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python -m pip install --find-links "$env:SQLCIPHER_WHEELHOUSE" -r requirements-dev.txt

      - name: Qualify the fixed SQLCipher runtime
        run: >
          python tools/qualify_sqlcipher_runtime.py
          --output "$env:RUNNER_TEMP\fixed-sqlcipher-runtime-evidence.json"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build extension
        run: npm run build --prefix extension

      - name: Test Windows production boot
        run: python -m pytest -m "not slow and windows_production and not stateful_tier_b"

      - name: Test Windows persistent SQLCipher general profile
        env:
          HYPOTHESIS_PROFILE: tier_b_general
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_brain_persistent_ingestion.py::TestPersistentGeneral
          --junitxml="$env:RUNNER_TEMP\tier-b-general-junit.xml"
          -vv

      - name: Test Windows persistent SQLCipher deletion profile
        env:
          HYPOTHESIS_PROFILE: tier_b_deletion
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_brain_persistent_ingestion.py::TestPersistentDeletion
          --junitxml="$env:RUNNER_TEMP\tier-b-deletion-junit.xml"
          -vv

      - name: Test Windows persistent SQLCipher smoke profile
        env:
          HYPOTHESIS_PROFILE: windows_persistence_smoke
        run: >
          python -m pytest
          --override-ini=addopts=
          tests/stateful/test_brain_persistent_ingestion.py::TestWindowsProductionPersistenceSmoke
          --junitxml="$env:RUNNER_TEMP\tier-b-smoke-junit.xml"
          -vv

      - name: Record Windows persistence CI source
        shell: pwsh
        run: |
          $payload = [ordered]@{
            schema_version = 1
            source_commit = $env:PRODUCT_SHA
            workflow_run_id = [long]$env:GITHUB_RUN_ID
            workflow_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
          }
          $payload | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\windows-persistence-ci-source.json"

      - name: Retain Windows persistence evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-persistence-evidence-${{ env.PRODUCT_SHA }}
          path: |
            ${{ runner.temp }}\fixed-sqlcipher-runtime-evidence.json
            ${{ runner.temp }}\tier-b-general-junit.xml
            ${{ runner.temp }}\tier-b-deletion-junit.xml
            ${{ runner.temp }}\tier-b-smoke-junit.xml
            ${{ runner.temp }}\windows-persistence-ci-source.json
          retention-days: 30
          if-no-files-found: error

      - name: Test backend
        run: python -m pytest

  windows-browser-e2e:
    needs: fixed-sqlcipher-wheel
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      ENVIRONMENT: test
      OFCA_TEST_DATABASE_MASTER_KEY_HEX: "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"
      OFCA_PRODUCT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT: ${{ github.workspace }}\artifacts\legal\execution
      OFCA_LEGAL_RUNTIME_PROOF_PATH: ${{ github.workspace }}\artifacts\legal\runtime-ui-proof.json

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Keep browser test caches on runner storage
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP "ofca-e2e"
          $npmCache = Join-Path $env:RUNNER_TEMP "npm-cache"
          $playwrightCache = Join-Path $env:RUNNER_TEMP "ms-playwright"
          New-Item -ItemType Directory -Force $testTemp, $npmCache, $playwrightCache | Out-Null
          "TMPDIR=$testTemp", "TEMP=$testTemp", "TMP=$testTemp", `
            "NPM_CONFIG_CACHE=$npmCache", "PLAYWRIGHT_BROWSERS_PATH=$playwrightCache" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/sqlcipher/fixed-runtime-sources.json

      - name: Retrieve fixed SQLCipher wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fixed-sqlcipher-wheel-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}\ofca-fixed-sqlcipher-wheelhouse

      - name: Verify fixed SQLCipher CI source
        shell: pwsh
        run: |
          $source = Get-Content -Raw "$env:RUNNER_TEMP\ofca-fixed-sqlcipher-wheelhouse\ci-source.json" | ConvertFrom-Json
          if ($source.source_commit -ne $env:PRODUCT_SHA) { throw "Fixed SQLCipher source SHA mismatch" }
          if ([long]$source.workflow_run_id -ne [long]$env:GITHUB_RUN_ID) { throw "Fixed SQLCipher run ID mismatch" }

      - name: Declare fixed SQLCipher wheelhouse
        shell: pwsh
        run: |
          "SQLCIPHER_WHEELHOUSE=$env:RUNNER_TEMP\ofca-fixed-sqlcipher-wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
            tools/e2e-capture/package-lock.json

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: ofca-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/e2e-capture/package-lock.json') }}

      - name: Install pinned native Noise toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install backend dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python -m pip install --find-links "$env:SQLCIPHER_WHEELHOUSE" -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Run Product #5 evidence scenarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results" | Out-Null
          $output = & node --test `
            extension/tests/activation-evidence.test.mjs `
            extension/tests/legal-activation-controller.test.mjs `
            extension/tests/legal-activation-revocation.test.mjs `
            extension/tests/legal-activation-crash-recovery.test.mjs 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\activation-evidence.tap"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build and audit deterministic extension artifact
        run: |
          npm run build --prefix extension
          npm run audit --prefix extension

      - name: Build production Bridge
        run: npm run build --prefix frontend

      - name: Install pinned E2E dependencies
        run: npm ci --prefix tools/e2e-capture

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tools/e2e-capture
        run: npx playwright install chromium

      - name: Run browser E2E and preserve output
        shell: pwsh
        working-directory: tools/e2e-capture
        run: |
          $output = & npm test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\browser-e2e.txt"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Generate Product #5 Legal evidence bundle
        shell: pwsh
        run: >
          node tools/legal-evidence/generate-activation-bundle.mjs
          --execution-root "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT"
          --runtime-proof "$env:OFCA_LEGAL_RUNTIME_PROOF_PATH"

      - name: Upload Product #5 Legal evidence bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legal-activation-v2-${{ env.PRODUCT_SHA }}
          path: artifacts/legal/activation-v2/${{ env.PRODUCT_SHA }}/
          if-no-files-found: error
