name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Check documentation
        run: python tools/check_docs.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Cache build caches
        uses: actions/cache@v4
        with:
          path: |
            frontend/.vite
            frontend/.swc
            frontend/.eslintcache
            frontend/tsconfig.tsbuildinfo
          key: build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify selected contract snapshot integrity
        run: python -m pytest -m contract_integrity tests/test_contract_snapshot.py

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test backend
        run: >
          python -m pytest
          -m "not slow and not windows_production"
          -vv
          --override-ini=faulthandler_timeout=120
          --durations=30

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Test extension
        run: npm test --prefix extension

      - name: Test provisioning page module
        run: node --test app/provisioning/provisioning.test.mjs

      - name: Build and audit deterministic extension artifact
        run: |
          npm run build --prefix extension
          npm run audit --prefix extension

      - name: Qualify bounded 10k-message snapshot repair
        run: npm run qualify:snapshot:ci --prefix extension

      - name: Upload frontend build
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: app/static/dist/

      - name: Upload audited extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: extension-dist
          path: extension/dist/

  windows-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Build extension
        run: npm run build --prefix extension

      # Production persistence derives its keys from Windows DPAPI, so these
      # tests are selected positively here rather than skipped elsewhere. The
      # invocation exits 5 if the marker ever stops matching them.
      - name: Test Windows production boot
        run: python -m pytest -m "not slow and windows_production"

      - name: Test backend
        run: python -m pytest

  windows-browser-e2e:
    # The activation and capture specs drive native Chrome optional-permission
    # dialogs through UI Automation. Keep them on a Windows runner;
    # test_ci_workflow.py keeps that binding required.
    runs-on: windows-latest

    env:
      ENVIRONMENT: test
      OFCA_TEST_DATABASE_MASTER_KEY_HEX: "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"
      OFCA_PRODUCT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT: ${{ github.workspace }}\artifacts\legal\execution
      OFCA_LEGAL_RUNTIME_PROOF_PATH: ${{ github.workspace }}\artifacts\legal\runtime-ui-proof.json

    steps:
      - name: Checkout proposed Product revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
            tools/e2e-capture/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Run Product #5 evidence scenarios
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results" | Out-Null
          $output = & node --test `
            extension/tests/activation-evidence.test.mjs `
            extension/tests/legal-activation-controller.test.mjs `
            extension/tests/legal-activation-revocation.test.mjs `
            extension/tests/legal-activation-crash-recovery.test.mjs 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\activation-evidence.tap"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build and audit deterministic extension artifact
        run: |
          npm run build --prefix extension
          npm run audit --prefix extension

      - name: Build production Bridge
        run: npm run build --prefix frontend

      - name: Install pinned E2E dependencies
        run: npm ci --prefix tools/e2e-capture

      - name: Install Playwright Chromium
        working-directory: tools/e2e-capture
        run: npx playwright install chromium

      - name: Run browser E2E and preserve output
        shell: pwsh
        working-directory: tools/e2e-capture
        run: |
          $output = & npm test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\browser-e2e.txt"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Generate Product #5 Legal evidence bundle
        shell: pwsh
        run: >
          node tools/legal-evidence/generate-activation-bundle.mjs
          --execution-root "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT"
          --runtime-proof "$env:OFCA_LEGAL_RUNTIME_PROOF_PATH"

      - name: Upload Product #5 Legal evidence bundle
        uses: actions/upload-artifact@v5
        with:
          name: legal-activation-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/legal/activation-v2/${{ github.event.pull_request.head.sha || github.sha }}/
          if-no-files-found: error
