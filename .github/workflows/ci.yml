          if ([int]$source.workflow_run_attempt -lt 1 -or [int]$source.workflow_run_attempt -gt [int]$env:GITHUB_RUN_ATTEMPT) { throw "Fixed SQLCipher producer attempt is invalid" }
      - name: Declare fixed SQLCipher wheelhouse
        shell: pwsh
        run: |
          "SQLCIPHER_WHEELHOUSE=$env:RUNNER_TEMP\ofca-fixed-sqlcipher-wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
            tools/e2e-capture/package-lock.json
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: ofca-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/e2e-capture/package-lock.json')
            }}
      - name: Install pinned native Noise toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install backend dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python -m pip install --find-links "$env:SQLCIPHER_WHEELHOUSE" -r requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install extension dependencies
        run: npm ci --prefix extension
      - name: 'Run Product #5 evidence scenarios'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results" | Out-Null
          $output = & node --test `
            extension/tests/activation-evidence.test.mjs `
            extension/tests/legal-activation-controller.test.mjs `
            extension/tests/legal-activation-revocation.test.mjs `
            extension/tests/legal-activation-crash-recovery.test.mjs 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\activation-evidence.tap"
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Build and audit deterministic extension artifact
        run: |
          npm run build --prefix extension
          npm run audit --prefix extension
      - name: Build production Bridge
        run: npm run build --prefix frontend
      - name: Install pinned E2E dependencies
        run: npm ci --prefix tools/e2e-capture
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tools/e2e-capture
        run: npx playwright install chromium
      - name: Run browser E2E and preserve output
        shell: pwsh
        working-directory: tools/e2e-capture
        run: |
          $output = & npm test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT\test-results\browser-e2e.txt"
          if ($exitCode -ne 0) { exit $exitCode }
      - name: 'Generate Product #5 Legal evidence bundle'
        shell: pwsh
        run: |
          node tools/legal-evidence/generate-activation-bundle.mjs --execution-root "$env:OFCA_LEGAL_EVIDENCE_EXECUTION_ROOT" --runtime-proof "$env:OFCA_LEGAL_RUNTIME_PROOF_PATH"
      - name: 'Upload Product #5 Legal evidence bundle'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: legal-activation-v2-${{ env.PRODUCT_SHA }}
          path: artifacts/legal/activation-v2/${{ env.PRODUCT_SHA }}/
          if-no-files-found: error
          overwrite: true
  required-ci-gate:
    name: Required CI
    if: ${{ always() }}
    needs:
      - web-build-and-test
      - backend-fast
      - analytics-integration
      - fixed-sqlcipher-wheel
      - windows-platform-contract
      - analytics-windows-contract
      - windows-full-regression
      - analytics-scale-qualification
      - windows-browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.PRODUCT_SHA }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Retrieve backend execution evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-tests-*
          path: artifacts/ci-downloaded
          merge-multiple: false
      - name: Require complete successful CI evidence
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_gate.py --needs-json "$CI_NEEDS_JSON" --reports-dir artifacts/ci-downloaded
  build-and-test:
    if: ${{ always() }}
    needs: required-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the existing required check
        run: test '${{ needs.required-ci-gate.result }}' = 'success'
  windows-tests:
    if: ${{ always() }}
    needs: required-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the existing required check
        run: test '${{ needs.required-ci-gate.result }}' = 'success'
