name: Temporary opaque redemption qualification

on:
  push:
    branches:
      - feat/capability-license-opaque-redemption

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint changed Python
        run: >-
          python -m ruff check
          app/security/capability_license_redemption.py
          app/api/endpoints/capability_license.py
          app/main.py
          tests/test_capability_license_opaque_redemption.py
          tools/regenerate_contract_snapshot.py
      - name: Type check changed security path
        run: >-
          python -m mypy
          app/security/capability_license_redemption.py
          app/api/endpoints/capability_license.py
      - name: Verify exact contract snapshot
        run: python tools/regenerate_contract_snapshot.py --check
      - name: Run opaque redemption and existing shipping tests
        run: >-
          python -m pytest
          tests/test_capability_license_opaque_redemption.py
          tests/test_capability_license_shipping.py
          tests/test_capability_license_delivery.py
          -q
