name: Temporary opaque redemption qualification

on:
  push:
    branches:
      - feat/capability-license-opaque-redemption

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/capability-license-opaque-redemption
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff mypy
      - name: Tighten typed validation discovered by qualification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/security/capability_license_redemption.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "from typing import Callable, Literal, Mapping, Protocol",
              "from typing import Callable, Literal, Mapping, Protocol, TypeAlias",
              1,
          )
          source = source.replace(
              "CapabilityLicenseRedemptionRefusal = Literal[",
              "CapabilityLicenseRedemptionRefusal: TypeAlias = Literal[",
              1,
          )
          source = source.replace(
              "CapabilityLicenseOpaqueRedemptionResult = (",
              "CapabilityLicenseOpaqueRedemptionResult: TypeAlias = (",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
      - name: Normalize changed Python
        run: >-
          python -m ruff check --fix --ignore B008
          app/security/capability_license_redemption.py
          app/api/endpoints/capability_license.py
          app/main.py
          tests/test_capability_license_opaque_redemption.py
      - name: Commit source corrections if needed
        run: |
          if git diff --quiet -- app/security/capability_license_redemption.py app/api/endpoints/capability_license.py app/main.py tests/test_capability_license_opaque_redemption.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/security/capability_license_redemption.py app/api/endpoints/capability_license.py app/main.py tests/test_capability_license_opaque_redemption.py
          git commit -m "typing: declare opaque redemption aliases"
          git push origin HEAD:feat/capability-license-opaque-redemption
      - name: Lint changed Python
        run: >-
          python -m ruff check --ignore B008
          app/security/capability_license_redemption.py
          app/api/endpoints/capability_license.py
          app/main.py
          tests/test_capability_license_opaque_redemption.py
      - name: Type check changed security path without repository baseline imports
        run: >-
          python -m mypy --follow-imports=skip --ignore-missing-imports
          app/security/capability_license_redemption.py
          app/api/endpoints/capability_license.py
      - name: Verify exact contract snapshot
        run: python tools/regenerate_contract_snapshot.py --check
      - name: Run opaque redemption and existing shipping tests
        run: >-
          python -m pytest
          tests/test_capability_license_opaque_redemption.py
          tests/test_capability_license_shipping.py
          tests/test_capability_license_delivery.py
          -q
