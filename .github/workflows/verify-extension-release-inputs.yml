name: Verify extension release inputs

# Qualification only: no publication, release tag, or Store submission.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-inputs:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Declare ephemeral paths
        shell: pwsh
        run: |
          "LEGAL_BINDINGS_DOCUMENT=$(Join-Path $env:RUNNER_TEMP 'qualification-legal.json')" >> $env:GITHUB_ENV
          "QUALIFICATION_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'qualification-extension')" >> $env:GITHUB_ENV
      - name: Verify approved Legal bindings through authenticated gate
        shell: pwsh
        env:
          PRODUCT_REVISION: ${{ github.sha }}
          LEGAL_REPOSITORY_REVISION: ad4f38ddd82f55bc054a756212385dd22655270b
          LEGAL_BINDINGS_REPOSITORY_REVISION: 1af27b19efa1f4701bd6d619530f9d44dc431148
          LEGAL_BINDINGS_PATH: compliance/cws/releases/2.0.1/legal-release-bindings.json
          LEGAL_BINDINGS_DIGEST: a42899ee8b86b978ef52dfb473c8b93b297f1fa49d1d4bf00322a72d09f1771f
          LEGAL_BINDINGS_REPOSITORY: ${{ secrets.LEGAL_BINDINGS_REPOSITORY }}
          LEGAL_BINDINGS_APP_ID: ${{ secrets.LEGAL_BINDINGS_APP_ID }}
          LEGAL_BINDINGS_APP_PRIVATE_KEY_B64: ${{ secrets.LEGAL_BINDINGS_APP_PRIVATE_KEY_B64 }}
          LEGAL_BINDINGS_INSTALLATION_ID: ${{ secrets.LEGAL_BINDINGS_INSTALLATION_ID }}
        run: node tools/legal-release-bindings/verify.mjs --output="$env:LEGAL_BINDINGS_DOCUMENT" --environment-file="$env:GITHUB_ENV"
      - name: Test Legal gate
        run: node --test tools/legal-release-bindings/verify.test.mjs
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --ignore-scripts
      - name: Build and audit verified inputs
        shell: pwsh
        run: |
          node extension/build.mjs --package --outdir="$env:QUALIFICATION_OUTPUT" --legal-release-bindings="$env:LEGAL_BINDINGS_DOCUMENT" --privacy-policy-url="$env:RELEASE_PRIVACY_POLICY_URL" --customer-release-config="app/core/customer-release.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          $manifest = Get-Content -LiteralPath extension/manifest.json -Raw | ConvertFrom-Json
          $artifact = Join-Path $env:QUALIFICATION_OUTPUT ("conversation-analytics-{0}.zip" -f $manifest.version)
          node extension/build.mjs --audit-package --artifact="$artifact" --legal-release-bindings="$env:LEGAL_BINDINGS_DOCUMENT" --privacy-policy-url="$env:RELEASE_PRIVACY_POLICY_URL" --customer-release-config="app/core/customer-release.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate audit failed' }
          # Record build identities. Public origin/trust ship; Legal input stays ephemeral.
          [ordered]@{ product_revision = $env:GITHUB_SHA; legal_bindings_digest = (Get-FileHash -LiteralPath $env:LEGAL_BINDINGS_DOCUMENT -Algorithm SHA256).Hash.ToLowerInvariant(); publication_trust_digest = (Get-FileHash -LiteralPath app/security/signing-publication-trust.json -Algorithm SHA256).Hash.ToLowerInvariant(); publication_release_digest = (Get-FileHash -LiteralPath app/core/signing-parameter-release.json -Algorithm SHA256).Hash.ToLowerInvariant(); privacy_policy_url = $env:RELEASE_PRIVACY_POLICY_URL; candidate_sha256 = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json -Compress
      - name: Remove staged private inputs
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('qualification-legal.json')) {
            $target = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
          }
