name: Windows package

# A Store candidate is built from an immutable Product revision and declared
# Legal coordinates. Publication origin and public verification trust are
# required checked-in release resources bound to that Product revision. Compatible
# parameter publications have their own signed authority and are not build inputs.
on:
  workflow_dispatch:
    inputs:
      product_revision:
        description: Full 40-character commit revision of the Product tree to build
        required: true
        type: string
      legal_repository_revision:
        description: Full 40-character Legal revision the bindings are approved at
        required: true
        type: string
      legal_bindings_repository_revision:
        description: Full 40-character Legal revision holding the bindings document
        required: true
        type: string
      legal_bindings_path:
        description: Exact path of the release bindings document in the Legal repository
        required: true
        type: string
      legal_bindings_digest:
        description: Expected canonical SHA-256 of that document, bare lowercase 64-hex
        required: true
        type: string

jobs:
  build:
    name: Build the unsigned package
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      # A Store candidate is produced only by a dispatch against an immutable v*
      # tag whose commit is the declared revision. Both hold before any document
      # is retrieved, any dependency is installed, anything is built and anything
      # is signed, so a dispatch from a branch head, or one whose declared
      # revision is not the tagged commit, leaves no artifact to sign and no run
      # for the release attestation to read. The tag grammar and the case-
      # sensitive comparisons are the ones the attestation applies to the same
      # two values, so a run this step admits cannot be one the attestation
      # refuses on its coordinates.
      - name: Require the dispatch ref to be the declared release tag
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_COMMIT: ${{ github.sha }}
          PRODUCT_REVISION: ${{ inputs.product_revision }}
        run: |
          if ($env:REF_TYPE -cne "tag") {
            throw "A Store candidate is built from a release tag, not from a $env:REF_TYPE"
          }
          if ($env:REF_NAME -cnotmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "A Store candidate is built from a v* release tag, not from $env:REF_NAME"
          }
          if ($env:PRODUCT_REVISION -cne $env:REF_COMMIT) {
            throw "product_revision is not the commit release tag $env:REF_NAME carries"
          }

      # Ephemeral runner storage, outside the workspace and outside any cache.
      # The verified documents are staged here and removed when the job ends.
      # The runner context carrying that location is not available to a job
      # environment, only to a step, so the path is declared once here and
      # enter the job environment from the first step.
      - name: Declare the staged release document paths
        shell: pwsh
        run: |
          $stem = "${{ github.run_id }}-${{ github.run_attempt }}"
          $bindings = Join-Path (Join-Path $env:RUNNER_TEMP "legal-release-bindings-$stem") "legal-release-bindings.json"
          "LEGAL_BINDINGS_DOCUMENT=$bindings" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.product_revision }}
          persist-credentials: false

      - name: Setup Node.js for the release gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The gate refuses the release unless the document held at the declared
      # Legal fetch revision and path canonicalizes to the declared digest and
      # carries the declared source revision. It runs before any dependency is
      # installed and before anything is built, and it stages the verified
      # document only once all of that holds, so a refusal leaves the packaging
      # step no bindings file to read.
      - name: Verify the Legal release bindings
        shell: pwsh
        env:
          PRODUCT_REVISION: ${{ inputs.product_revision }}
          LEGAL_REPOSITORY_REVISION: ${{ inputs.legal_repository_revision }}
          LEGAL_BINDINGS_REPOSITORY_REVISION: ${{ inputs.legal_bindings_repository_revision }}
          LEGAL_BINDINGS_PATH: ${{ inputs.legal_bindings_path }}
          LEGAL_BINDINGS_DIGEST: ${{ inputs.legal_bindings_digest }}
          LEGAL_BINDINGS_REPOSITORY: ${{ secrets.LEGAL_BINDINGS_REPOSITORY }}
          LEGAL_BINDINGS_APP_ID: ${{ secrets.LEGAL_BINDINGS_APP_ID }}
          LEGAL_BINDINGS_APP_PRIVATE_KEY_B64: ${{ secrets.LEGAL_BINDINGS_APP_PRIVATE_KEY_B64 }}
          LEGAL_BINDINGS_INSTALLATION_ID: ${{ secrets.LEGAL_BINDINGS_INSTALLATION_ID }}
        run: >
          node tools/legal-release-bindings/verify.mjs
          --output="$env:LEGAL_BINDINGS_DOCUMENT"
          --environment-file="$env:GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packaging/requirements-build.txt
            packaging/sqlcipher/fixed-runtime-sources.json

      - name: Build fixed SQLCipher wheel from pinned sources
        shell: pwsh
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "ofca-fixed-sqlcipher-wheelhouse"
          .\packaging\sqlcipher\build-fixed-wheel.ps1 `
            -BuildPython (Get-Command python.exe).Source `
            -Wheelhouse $wheelhouse
          "SQLCIPHER_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install pinned native Noise toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Create isolated build environment
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install `
            --find-links "$env:SQLCIPHER_WHEELHOUSE" `
            -r requirements.txt -r packaging/requirements-build.txt

      # The packaged first-run test runs on the runner interpreter and drives
      # the isolated build environment through -BuildPython, so the test
      # dependencies stay out of the environment that freezes the artifact.
      - name: Install the test dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: python -m pip install --find-links "$env:SQLCIPHER_WHEELHOUSE" -r requirements-dev.txt

      # Every release input the script demands is passed from a verified
      # coordinate: the two staged documents, and the privacy policy URL the
      # bindings gate derived from the document it verified. None of them is
      # written down here, so none of them can drift from what was attested.
      - name: Build package
        run: |
          .\packaging\build-windows.ps1 `
            -BuildPython .\.build-venv\Scripts\python.exe `
            -OutputRoot "$env:RUNNER_TEMP\windows-package" `
            -LegalReleaseBindings "$env:LEGAL_BINDINGS_DOCUMENT" `
            -PrivacyPolicyUrl "$env:RELEASE_PRIVACY_POLICY_URL"

      # A packaged build that cannot complete a first run must not reach the
      # artifact. This freezes a real installer with the build environment
      # above and runs the unmodified smoke harness against it. The test
      # carries the slow marker, which pytest.ini deselects by default, so the
      # marker is selected explicitly.
      - name: Qualify the packaged first run
        env:
          BRAIN_INSTALLED_LAUNCHER_E2E: '1'
          BRAIN_PACKAGED_BUILD_PYTHON: ${{ github.workspace }}\.build-venv\Scripts\python.exe
        run: python -m pytest -m slow tests/test_packaged_runtime.py::test_real_installed_launcher_starts_the_frozen_brain_and_owns_its_listener

      - name: Qualify the frozen SQLCipher and companion Noise runtimes
        env:
          BRAIN_PACKAGED_ARTIFACT_DIR: ${{ runner.temp }}\windows-package\dist\Brain
        run: >
          python -m pytest
          tests/test_packaged_runtime.py::test_frozen_executable_reports_the_fixed_sqlcipher_runtime
          tests/test_packaged_runtime.py::test_frozen_executable_loads_the_production_companion_noise_factory
          -vv

      - name: Record the shipped native companion artifact identity
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "windows-package\dist\Brain"
          $report = Join-Path $env:RUNNER_TEMP "windows-package-companion-runtime.json"
          $env:BRAIN_COMPANION_RUNTIME_REPORT_PATH = $report
          $probe = Start-Process -FilePath (Join-Path $artifact "Brain.exe") -ArgumentList "--companion-runtime-report" -WorkingDirectory $artifact -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0 -or -not (Test-Path $report -PathType Leaf)) { throw "frozen companion identity probe failed" }
          Get-Content $report

      - name: Retain production companion native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-companion-${{ inputs.product_revision }}
          path: |
            ${{ runner.temp }}\windows-package-companion-runtime.json
            native/companion-snow/Cargo.lock
            native/companion-snow/THIRD_PARTY_NOTICES.txt
            extension/vendor/companion-snow/release.json
          retention-days: 90
          if-no-files-found: error

      # The release candidate's native dependency evidence travels separately
      # from the installer because signing later rewrites only the installer.
      - name: Retain fixed SQLCipher wheel and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-sqlcipher-${{ inputs.product_revision }}
          path: ${{ runner.temp }}\ofca-fixed-sqlcipher-wheelhouse\
          retention-days: 90
          if-no-files-found: error

      - name: Retain package size measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-measurements-${{ inputs.product_revision }}
          path: ${{ runner.temp }}\windows-package\package-measurements.json
          retention-days: 90
          if-no-files-found: error

      # The installer directory is the artifact set: the installer, the Agent
      # bundle, and the sha256sums.txt computed over both. Signing rewrites the
      # installer, so the signing job recomputes that digest file.
      - name: Upload the unsigned package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-unsigned-${{ github.ref_name }}
          path: ${{ runner.temp }}\windows-package\installer\

      # Staged Legal bindings stay outside the workspace, uploads and caches.
      # Public publication trust/origin ship as revision-bound runtime resources.
      - name: Remove the staged release documents
        if: always()
        shell: pwsh
        run: |
          $staged = @{
            "legal-release-bindings-" = $env:LEGAL_BINDINGS_DOCUMENT
          }
          foreach ($prefix in $staged.Keys) {
            $directory = [IO.Path]::GetFullPath((Split-Path -Parent $staged[$prefix]))
            $taskTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            if (-not $directory.StartsWith($taskTempRoot, [StringComparison]::OrdinalIgnoreCase) -or -not (Split-Path -Leaf $directory).StartsWith($prefix, [StringComparison]::Ordinal)) {
              throw "Refusing to clean an unexpected temporary path"
            }
            Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
          }

  sign:
    # The federated credential is scoped to a job, not to a step, so this job
    # installs no dependency, compiles nothing, checks out no build tooling,
    # and pins every action it runs to a commit.
    name: Sign and publish the package
    needs: build
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_DIRECTORY: ${{ github.workspace }}\release

    steps:
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.product_revision }}
          sparse-checkout: |
            packaging/verify-signatures.ps1
            packaging/write-digests.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the unsigned package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-package-unsigned-${{ github.ref_name }}
          path: ${{ github.workspace }}\release

      - name: Acquire a federated Azure token
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 630068e3-b320-40bb-acd0-3d8f1d70d545
          tenant-id: f6894ba7-98c1-4b4b-bbe4-1b3f9584a861
          subscription-id: f16174c3-f1aa-494b-b813-675d03956f3c

      # The signing certificate is short-lived, so the countersignature timestamp
      # is what keeps a released signature verifying after it expires. The
      # timestamp authority is declared here rather than left to an action
      # default, and the verification step rejects an untimestamped signature.
      - name: Sign the installer
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://swn.codesigning.azure.net/
          signing-account-name: Dipsy
          certificate-profile-name: simple-legal-doc-signer
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        id: verify-signatures
        shell: pwsh
        run: .\packaging\verify-signatures.ps1 -Path "$env:RELEASE_DIRECTORY"

      - name: Digest the published artifacts
        shell: pwsh
        run: .\packaging\write-digests.ps1 -Directory "$env:RELEASE_DIRECTORY"

      - name: Publish the signed package
        if: steps.verify-signatures.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package-${{ github.ref_name }}
          path: ${{ github.workspace }}\release\
