name: Temporary opaque redemption contract pin

on:
  push:
    branches:
      - feat/capability-license-opaque-redemption

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/capability-license-opaque-redemption
      - name: Update exact qualified contract snapshot
        run: python tools/tmp_pin_opaque_redemption_contracts.py
      - name: Commit exact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts tools/regenerate_contract_snapshot.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "contracts: pin opaque redemption contract revision"
          git push origin HEAD:feat/capability-license-opaque-redemption
