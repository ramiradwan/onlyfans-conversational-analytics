name: Temporary opaque redemption patch

on:
  push:
    branches:
      - feat/capability-license-opaque-redemption

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/capability-license-opaque-redemption
      - name: Apply fail-closed corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/security/capability_license_redemption.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '            or not isinstance(challenge_bytes, str)\n            or len(_b64u_decode(challenge_bytes)) != 32\n',
              '            or not _b64u32(challenge_bytes)\n',
              1,
          )
          source = source.replace(
              '        if response.status_code in {400, 409}:\n            raise CapabilityLicenseRedemptionRefused("redemption_conflict")\n',
              '        if response.status_code == 400:\n            raise CapabilityLicenseRedemptionRefused("redemption_invalid")\n'
              '        if response.status_code == 409:\n            raise CapabilityLicenseRedemptionRefused("redemption_conflict")\n',
              1,
          )
          marker = '\ndef _b64u_decode(value: str) -> bytes:\n'
          helper = '''\ndef _b64u32(value: object) -> bool:\n    if not isinstance(value, str):\n        return False\n    try:\n        return len(_b64u_decode(value)) == 32\n    except ValueError:\n        return False\n\n\n'''
          if helper.strip() not in source:
              source = source.replace(marker, helper + marker.lstrip('\n'), 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- app/security/capability_license_redemption.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/security/capability_license_redemption.py
          git commit -m "security: fail closed on malformed redemption challenges"
          git push origin HEAD:feat/capability-license-opaque-redemption
