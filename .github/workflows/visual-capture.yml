name: Visual capture

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'extension/popup.html'
      - 'extension/popup.css'
      - 'extension/popup.js'
      - 'extension/runtime/customer-journey.mjs'
      - 'extension/qualification/*visual*.mjs'
      - 'app/provisioning/provisioning.html'
      - 'app/provisioning/provisioning.js'
      - 'tools/visual-capture/**'
      - '.github/workflows/visual-capture.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'extension/popup.html'
      - 'extension/popup.css'
      - 'extension/popup.js'
      - 'extension/runtime/customer-journey.mjs'
      - 'extension/qualification/*visual*.mjs'
      - 'app/provisioning/provisioning.html'
      - 'app/provisioning/provisioning.js'
      - 'tools/visual-capture/**'
      - '.github/workflows/visual-capture.yml'

permissions:
  contents: read

concurrency:
  group: visual-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            tools/visual-capture/package-lock.json

      - name: Keep Playwright Chromium in the Actions cache
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: visual-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/visual-capture/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install visual capture dependencies
        run: npm ci --prefix tools/visual-capture

      - name: Install Chromium system dependencies
        working-directory: tools/visual-capture
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tools/visual-capture
        run: npx playwright install chromium

      - name: Test visual capture contracts
        run: node --test tools/visual-capture/*.test.mjs

      - name: Capture visual states
        env:
          VISUAL_CAPTURE_REVISION: ${{ env.PRODUCT_SHA }}
        run: node tools/visual-capture/capture.mjs artifacts/visual-capture

      - name: Record color qualification
        run: npm run generate:theme --prefix frontend -- --color-report ../artifacts/visual-capture/color-qualification.json

      - name: Upload visual states
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-states-${{ env.PRODUCT_SHA }}
          path: artifacts/visual-capture/
          retention-days: 30
          if-no-files-found: error
