name: Temporary contract pin refresh
on:
  push:
    branches:
      - feat/capability-license-opaque-redemption
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/capability-license-opaque-redemption
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python tools/tmp_refresh_contract_pin.py
      - name: Commit corrected integrity test
        run: |
          if git diff --quiet -- tests/test_contract_snapshot.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_contract_snapshot.py
          git commit -m "test: refresh contract snapshot integrity pins"
          git push origin HEAD:feat/capability-license-opaque-redemption
