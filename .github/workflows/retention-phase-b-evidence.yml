name: Retention Phase-B Evidence

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lifecycle-evidence:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: artifacts/retention/phase-b
      PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact Product revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Initialize exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          payload = {
              "schema_version": 1,
              "source_commit": os.environ["PRODUCT_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          (root / "source.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run backend lifecycle scenarios
        run: >
          python -m pytest
          tests/test_creator_vault_retention.py
          tests/test_retention_participant_scope.py
          tests/test_creator_vault_api.py
          tests/test_creator_vault_export.py
          tests/test_analytics_retention.py
          tests/test_historical_analytics_retention.py
          tests/test_retention_ingress_paths.py
          tests/test_projection_backup_restore_retention.py
          tests/test_managed_recovery_publication.py
          tests/test_recovery_publication_boundaries.py
          tests/test_retention_restore_authority.py
          tests/test_retention_ci_regressions.py
          tests/test_retention_maintenance.py
          -vv
          --junitxml="$EVIDENCE_DIR/backend-junit.xml"

      - name: Run Creator Vault frontend scenarios
        run: >
          npm test --prefix frontend --
          tests/CreatorVaultControls.test.tsx
          --reporter=junit
          --outputFile=../artifacts/retention/phase-b/frontend-junit.xml

      - name: Run Extension replay scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            extension/tests/retention-history-replay.test.mjs \
            extension/tests/retention-outbox-retry.test.mjs \
            extension/tests/retention-lifecycle-independence.test.mjs \
            | tee "$EVIDENCE_DIR/extension.tap"

      - name: Record scenario outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          payload = {
              "schema_version": 1,
              "source_commit": os.environ["PRODUCT_SHA"],
              "results": {
                  "backend": "backend-junit.xml",
                  "frontend": "frontend-junit.xml",
                  "extension": "extension.tap",
              },
          }
          (root / "scenario-results.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          test -s "$EVIDENCE_DIR/source.json"
          test -s "$EVIDENCE_DIR/backend-junit.xml"
          test -s "$EVIDENCE_DIR/frontend-junit.xml"
          test -s "$EVIDENCE_DIR/extension.tap"
          test -s "$EVIDENCE_DIR/scenario-results.json"

      - name: Verify ordinary CI for exact Product SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sha = os.environ["PRODUCT_SHA"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          root = Path(os.environ["EVIDENCE_DIR"])
          deadline = time.monotonic() + 3600
          last = []

          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({
                  "head_sha": sha,
                  "event": "pull_request",
                  "per_page": 100,
              })
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              matches = [
                  run for run in runs
                  if run.get("name") == "CI" and run.get("head_sha") == sha
              ]
              last = [
                  {
                      "id": run.get("id"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "run_attempt": run.get("run_attempt"),
                  }
                  for run in matches
              ]
              successful = [
                  run for run in matches
                  if run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ]
              if successful:
                  run = max(
                      successful,
                      key=lambda item: (
                          int(item.get("run_number") or 0),
                          int(item.get("run_attempt") or 0),
                      ),
                  )
                  payload = {
                      "schema_version": 1,
                      "source_commit": sha,
                      "workflow": run["name"],
                      "run_id": int(run["id"]),
                      "run_number": int(run["run_number"]),
                      "run_attempt": int(run.get("run_attempt") or 1),
                      "event": run["event"],
                      "status": run["status"],
                      "conclusion": run["conclusion"],
                      "html_url": run["html_url"],
                  }
                  (root / "ordinary-ci.json").write_text(
                      json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
                      encoding="utf-8",
                  )
                  break
              time.sleep(15)
          else:
              raise SystemExit(
                  "ordinary CI did not complete successfully for exact source commit: "
                  + json.dumps(last, sort_keys=True)
              )
          PY

      - name: Emit retention evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/retention/creator-vault-acceptance.json "$EVIDENCE_DIR/acceptance.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          source = json.loads((root / "source.json").read_text(encoding="utf-8"))
          ordinary = json.loads((root / "ordinary-ci.json").read_text(encoding="utf-8"))
          acceptance = json.loads((root / "acceptance.json").read_text(encoding="utf-8"))

          def junit(path):
              tree = ET.parse(path)
              cases = list(tree.getroot().iter("testcase"))
              failures = sum(
                  case.find("failure") is not None or case.find("error") is not None
                  for case in cases
              )
              skipped = sum(case.find("skipped") is not None for case in cases)
              return {
                  "tests": len(cases),
                  "failures_or_errors": failures,
                  "skipped": skipped,
                  "identifiers": sorted(
                      {
                          str(case.attrib.get("name", "")).strip()
                          for case in cases
                          if str(case.attrib.get("name", "")).strip()
                      }
                  ),
              }

          backend = junit(root / "backend-junit.xml")
          frontend = junit(root / "frontend-junit.xml")
          extension_text = (root / "extension.tap").read_text(encoding="utf-8")
          tap_tests = re.findall(r"^# tests (\d+)$", extension_text, re.MULTILINE)
          tap_fail = re.findall(r"^# fail (\d+)$", extension_text, re.MULTILINE)
          tap_skipped = re.findall(r"^# skipped (\d+)$", extension_text, re.MULTILINE)
          extension_identifiers = {
              match.strip()
              for match in re.findall(r"^ok \d+ - (.+)$", extension_text, re.MULTILINE)
              if match.strip()
          }
          extension = {
              "tests": int(tap_tests[-1]) if tap_tests else 0,
              "failures": int(tap_fail[-1]) if tap_fail else 1,
              "skipped": int(tap_skipped[-1]) if tap_skipped else 0,
              "identifiers": sorted(extension_identifiers),
          }

          suites_pass = (
              backend["tests"] > 0
              and backend["failures_or_errors"] == 0
              and backend["skipped"] == 0
              and frontend["tests"] > 0
              and frontend["failures_or_errors"] == 0
              and frontend["skipped"] == 0
              and extension["tests"] > 0
              and extension["failures"] == 0
              and extension["skipped"] == 0
          )

          backend_names = set(backend["identifiers"])
          scenario_matrix = []
          for criterion in acceptance["criteria"]:
              references = list(criterion.get("tests", []))
              observed = []
              for reference in references:
                  if reference.startswith("test_"):
                      hit = any(
                          name == reference or name.startswith(reference + "[")
                          for name in backend_names
                      )
                  elif reference == "Retention Phase-B Evidence workflow":
                      hit = True
                  elif reference.startswith("CreatorVaultControls"):
                      hit = frontend["tests"] > 0 and frontend["failures_or_errors"] == 0
                  else:
                      hit = reference in extension_identifiers
                  observed.append({"identifier": reference, "observed": hit})
              scenario_matrix.append({
                  "criterion_id": criterion["id"],
                  "status": criterion["status"],
                  "required_tests": observed,
                  "all_required_observed": bool(references) and all(
                      item["observed"] for item in observed
                  ),
              })

          (root / "scenario-matrix.json").write_text(
              json.dumps(
                  {"schema_version": 1, "source_commit": source["source_commit"],
                   "criteria": scenario_matrix},
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )

          required_files = [
              "source.json",
              "ordinary-ci.json",
              "scenario-results.json",
              "scenario-matrix.json",
              "acceptance.json",
              "backend-junit.xml",
              "frontend-junit.xml",
              "extension.tap",
          ]
          digests = {}
          for name in required_files:
              data = (root / name).read_bytes()
              digests[name] = hashlib.sha256(data).hexdigest()
          cohort_seed = "".join(
              f"{digests[name]}  {name}\n" for name in sorted(digests)
          ).encode("utf-8")
          cohort_digest = hashlib.sha256(cohort_seed).hexdigest()

          criteria_complete = (
              acceptance.get("coverage_status") == "COMPLETE"
              and acceptance.get("fail_closed") is True
              and all(item.get("status") == "implemented" for item in acceptance["criteria"])
              and all(item["all_required_observed"] for item in scenario_matrix)
          )
          closure_ready = (
              source["source_commit"] == os.environ["PRODUCT_SHA"]
              and ordinary["source_commit"] == os.environ["PRODUCT_SHA"]
              and ordinary["conclusion"] == "success"
              and suites_pass
              and criteria_complete
          )
          manifest = {
              "schema_version": 1,
              "source_commit": os.environ["PRODUCT_SHA"],
              "ordinary_ci": ordinary,
              "dedicated_workflow": {
                  "name": source["workflow"],
                  "run_id": source["workflow_run_id"],
                  "run_attempt": source["workflow_run_attempt"],
              },
              "suite_results": {
                  "backend": {
                      "tests": backend["tests"],
                      "failures_or_errors": backend["failures_or_errors"],
                      "skipped": backend["skipped"],
                  },
                  "frontend": {
                      "tests": frontend["tests"],
                      "failures_or_errors": frontend["failures_or_errors"],
                      "skipped": frontend["skipped"],
                  },
                  "extension": extension,
              },
              "acceptance": {
                  "coverage_status": acceptance.get("coverage_status"),
                  "fail_closed": acceptance.get("fail_closed"),
              },
              "scenario_matrix": "scenario-matrix.json",
              "file_sha256": digests,
              "evidence_cohort_sha256": cohort_digest,
              "closure_ready": closure_ready,
          }
          manifest_path = root / "manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          checksum_names = required_files + ["manifest.json"]
          lines = []
          for name in sorted(checksum_names):
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          (root / "SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          if not closure_ready:
              raise SystemExit("Phase-B evidence is not closure-ready")
          PY

      - name: Upload exact-head lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: retention-phase-b-${{ env.PRODUCT_SHA }}
          path: artifacts/retention/phase-b/
          if-no-files-found: error
