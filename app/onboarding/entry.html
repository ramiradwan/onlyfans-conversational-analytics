<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Conversation Analytics</title>
  <!-- setup-first-paint:start -->
<script data-setup-first-paint>// Generated by scripts/generate-setup-theme.js. Do not edit.
(function applyTheme(document, storage) {
  try {
    if (storage === undefined) storage = globalThis.localStorage;
    const selected = storage.getItem('mui-mode');
    if (selected === 'light' || selected === 'dark') {
      document.documentElement.dataset.colorScheme = selected;
      // The browser paints its canvas before the external stylesheet arrives.
      document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', selected);
    } else {
      delete document.documentElement.dataset.colorScheme;
      document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', 'light dark');
    }
  } catch { /* The system theme remains available when local storage is denied. */ }
})(document);
</script>
<style data-setup-first-paint>:root{color-scheme:light;background-color:oklch(96.7853% 0.00453 78.30);color:oklch(21.9569% 0.00360 164.71)}
:root[data-color-scheme="dark"]{color-scheme:dark;background-color:oklch(20.3962% 0.00728 164.17);color:oklch(96.7794% 0.00449 134.85)}
@media (prefers-color-scheme: dark){:root:not([data-color-scheme="light"]){color-scheme:dark;background-color:oklch(20.3962% 0.00728 164.17);color:oklch(96.7794% 0.00449 134.85)}}
@media (forced-colors:active){:root{background:Canvas;color:CanvasText}}
/* Match the native startup surface while the one-use admission is checked. */
:root { font-family: system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; }
header { display: flex; align-items: center; gap: 1rem; min-height: 72px; padding: 12px 24px 12px 32px; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); font-weight: 600; }
main { max-width: 880px; margin: 0 auto; padding: 56px 32px; }
h1 { margin: 0 0 16px; font-size: clamp(1.65rem, 3vw, 2rem); line-height: 1.2; font-weight: 600; }
p { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
@media (max-width: 600px) { header { padding-inline: 16px 8px; } main { padding: 28px 16px; } }
@media (forced-colors: active) { :root { background: Canvas; color: CanvasText; } header { border-color: CanvasText; } }
</style>
<!-- setup-first-paint:end -->
</head>
<body>
  <header data-desktop-drag-region>
    <span>Conversation Analytics</span>
    <desktop-window-controls></desktop-window-controls>
  </header>
  <main><h1>Opening setup</h1><p id="status" role="status">Checking this setup link…</p></main>
  <script src="/onboarding/entry.js" defer></script>
</body>
</html>
