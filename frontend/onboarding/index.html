<!doctype html>
<html lang="en" data-microsoft-picker="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>Set up Conversation Analytics</title>
  </head>
  <body class="desktop-onboarding-page">
    <header class="setup-header" data-desktop-drag-region>
      <span class="setup-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" focusable="false"><path d="M5 3.75h10A2.25 2.25 0 0 1 17.25 6v6A2.25 2.25 0 0 1 15 14.25h-4.4L7 16.75v-2.5H5A2.25 2.25 0 0 1 2.75 12V6A2.25 2.25 0 0 1 5 3.75Z"/><path d="M6.25 10.75 8.7 8.45l2 1.45 2.8-3"/><circle cx="6.25" cy="10.75" r=".8"/><circle cx="8.7" cy="8.45" r=".8"/><circle cx="10.7" cy="9.9" r=".8"/><circle cx="13.5" cy="6.9" r=".8"/></svg>
        </span>
        <span class="brand-name">Conversation Analytics</span>
      </span>
      <div id="header-account" class="setup-account" hidden>
        <span id="header-account-avatar" class="account-avatar" aria-hidden="true"></span>
        <span class="setup-account-text">
          <span id="header-account-name"></span>
          <span id="header-account-handle" hidden></span>
        </span>
      </div>
      <desktop-window-controls></desktop-window-controls>
    </header>
    <main class="setup-main desktop-setup" data-journey-state="desktop.setup_loading">
      <nav aria-label="Setup progress">
        <ol class="setup-steps" role="list">
          <li data-step="browser-access"><span class="setup-step-badge" aria-hidden="true"><span>1</span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span><span class="setup-step-label">Set up browser access</span></li>
          <li data-step="account-connection"><span class="setup-step-badge" aria-hidden="true"><span>2</span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span><span class="setup-step-label">Connect your account</span></li>
          <li data-step="finish-setup"><span class="setup-step-badge" aria-hidden="true"><span>3</span><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span><span class="setup-step-label">Finish setup</span></li>
        </ol>
      </nav>
      <section class="setup-card setup-task-card" aria-labelledby="task-title" aria-busy="true" data-reserved-region="desktop-task-card">
        <div class="desktop-task-header">
          <span class="desktop-task-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.89-2-2-2m0 14H5V8h14z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 5.9c1.16 0 2.1.94 2.1 2.1s-.94 2.1-2.1 2.1S9.9 9.16 9.9 8s.94-2.1 2.1-2.1m0 9c2.97 0 6.1 1.46 6.1 2.1v1.1H5.9V17c0-.64 3.13-2.1 6.1-2.1M12 4C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4m0 9c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4"/></svg>
            <svg viewBox="0 0 24 24"><path d="M21 10h-8.35C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H13l2 2 2-2 2 2 4-4.04zM7 15c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3"/></svg>
            <svg viewBox="0 0 24 24"><path d="M10.5 4.5c.28 0 .5.22.5.5v2h6v6h2c.28 0 .5.22.5.5s-.22.5-.5.5h-2v6h-2.12c-.68-1.75-2.39-3-4.38-3s-3.7 1.25-4.38 3H4v-2.12c1.75-.68 3-2.39 3-4.38S5.76 9.8 4.01 9.12L4 7h6V5c0-.28.22-.5.5-.5m0-2C9.12 2.5 8 3.62 8 5H4c-1.1 0-1.99.9-1.99 2v3.8h.29c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-.3c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7v.3H17c1.1 0 2-.9 2-2v-4c1.38 0 2.5-1.12 2.5-2.5S20.38 11 19 11V7c0-1.1-.9-2-2-2h-4c0-1.38-1.12-2.5-2.5-2.5"/></svg>
            <svg data-task-icon="lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2M9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9zm9 14H6V10h12zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2"/></svg>
            <svg data-task-icon="app" viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2zM4 6h16v10H4z"/></svg>
          </span>
          <p class="setup-eyebrow" id="task-step"></p>
        </div>
        <h1 data-region-content id="task-title" tabindex="-1">Loading setup</h1>
        <p data-region-content id="task-description" hidden></p>
        <div class="desktop-loading-copy" aria-hidden="true"><span></span><span></span></div>
        <div class="task-actions-slot" data-reserved-region="desktop-task-actions"><div data-region-content>
        <div class="desktop-loading-action" aria-hidden="true"></div>
        <div id="sign-in-options" class="provider-choices" role="group" aria-label="Sign-in options" hidden>
          <button class="provider-button" type="button" data-provider="google" aria-describedby="task-description task-status">
            <img src="../shared-setup/providers/google.png" alt="" width="20" height="20"><span>Continue with Google</span>
          </button>
          <button class="provider-button" type="button" data-provider="microsoft-personal" aria-describedby="task-description task-status">
            <img src="../shared-setup/providers/microsoft.svg" alt="" width="20" height="20"><span>Continue with Microsoft</span>
          </button>
          <button class="provider-button" type="button" data-provider="telegram" aria-describedby="task-description task-status">Continue with Telegram</button>
          <button class="provider-button" type="button" data-provider="tiktok" aria-describedby="task-description task-status">Continue with TikTok</button>
          <button class="provider-button" type="button" data-provider="default" aria-describedby="task-description task-status">Other sign-in options</button>
        </div>
        <dl id="decision-details" class="decision-details" hidden>
          <div>
            <dt>Account</dt>
            <dd>
              <span id="decision-account-glyph" class="identity-tile" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" focusable="false"><circle cx="11" cy="8" r="3.5"/><path d="M4.5 18.5c.9-3.4 3.4-5.25 6.5-5.25s5.6 1.85 6.5 5.25"/></svg>
              </span>
              <span id="decision-account">OnlyFans account</span>
            </dd>
          </div>
          <div>
            <dt>Computer</dt>
            <dd>
              <span class="identity-tile" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="4" y="5" width="14" height="9.5" rx="1.5"/><path d="M2.5 17.5h17"/></svg>
              </span>
              <span id="decision-computer">This computer</span>
            </dd>
          </div>
        </dl>
        <section id="account-passkey-setup" data-journey-state="desktop.setup_account_passkey" hidden>
          <p id="account-passkey-description">Use one passkey to sign in to Dipsy and open saved data on this computer.</p>
          <div class="setup-actions">
            <button id="account-passkey-create" type="button" aria-describedby="account-passkey-description account-passkey-status">Create passkey</button>
            <button id="account-passkey-later" class="secondary" type="button">Finish later</button>
          </div>
          <p id="account-passkey-status" class="task-status" role="status" aria-live="polite" hidden></p>
          <p id="account-passkey-help" class="task-status" hidden></p>
        </section>
        <section id="local-access" aria-labelledby="local-access-title" data-journey-state="desktop.setup_local_access" hidden>
          <h2 id="local-access-title" class="desktop-sr-only">Access on this computer</h2>
          <p id="local-access-description" hidden></p>
          <div class="setup-actions">
            <button id="local-authenticate" type="button" aria-describedby="task-description local-access-description local-auth-status" hidden>Create passkey</button>
            <p class="task-status" id="local-auth-pending" role="status" aria-live="polite" hidden></p>
          </div>
          <p class="task-status" id="local-auth-status" role="status" aria-live="polite"></p>
        </section>
        <div class="setup-actions">
          <p class="task-status" id="task-pending" role="status" aria-live="polite" hidden></p>
          <button id="task-action" type="button" aria-describedby="task-description task-status" hidden></button>
          <button id="browser-reopen" class="secondary" type="button" aria-describedby="task-status" hidden>Open browser</button>
          <button id="protected-cancel" class="secondary" type="button" aria-describedby="task-status" hidden>Cancel sign-in</button>
          <button id="sign-in-back" class="secondary" type="button" hidden>Back</button>
          <button id="setup-code-open" type="button" class="secondary" hidden>I have a setup code</button>
          <a id="saved-data-open" hidden>Open saved data</a>
        </div>
        <div id="decision-sign-in" class="desktop-sign-in" hidden>
          <p id="decision-provider" hidden></p>
          <button id="sign-in-switch" class="secondary" type="button" aria-describedby="task-status" hidden>Change sign-in</button>
        </div>
        </div></div>
        <p data-reserved-region="desktop-task-status" class="task-status" id="task-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <template id="support-channels"></template>
    <template id="desktop-status-icons">
      <svg data-status-icon="info" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8"/></svg>
      <svg data-status-icon="attention" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2M12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8"/></svg>
      <svg data-status-icon="done" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m4.59-12.42L10 14.17l-2.59-2.58L6 13l4 4 8-8z"/></svg>
      <svg data-status-icon="pending" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="38 13" stroke-linecap="round"/></svg>
    </template>
    <script type="module" src="./main.js"></script>
  </body>
</html>
