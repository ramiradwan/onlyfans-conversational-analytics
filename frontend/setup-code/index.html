<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Use a setup code</title></head>
<body><header class="setup-header"><span class="setup-brand"><span class="brand-mark" aria-hidden="true">
<svg viewBox="0 0 20 20" fill="none" focusable="false"><path d="M5 3.75h10A2.25 2.25 0 0 1 17.25 6v6A2.25 2.25 0 0 1 15 14.25h-4.4L7 16.75v-2.5H5A2.25 2.25 0 0 1 2.75 12V6A2.25 2.25 0 0 1 5 3.75Z"/><path d="M6.25 10.75 8.7 8.45l2 1.45 2.8-3"/><circle cx="6.25" cy="10.75" r=".8"/><circle cx="8.7" cy="8.45" r=".8"/><circle cx="10.7" cy="9.9" r=".8"/><circle cx="13.5" cy="6.9" r=".8"/></svg>
</span><span class="brand-name">Conversation Analytics</span></span></header>
<main class="setup-main"><section class="setup-card setup-code-card" aria-labelledby="receiving-title" data-state="opening">
<div class="task-head"><span class="setup-code-spot" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M2 17h20v2H2zm1.15-4.05L4 11.47l.85 1.48 1.3-.75-.85-1.48H7v-1.5H5.3l.85-1.47L4.85 7 4 8.47 3.15 7l-1.3.75.85 1.47H1v1.5h1.7l-.85 1.48zm6.7-.75 1.3.75.85-1.48.85 1.48 1.3-.75-.85-1.48H15v-1.5h-1.7l.85-1.47-1.3-.75L12 8.47 11.15 7l-1.3.75.85 1.47H9v1.5h1.7zM23 9.22h-1.7l.85-1.47-1.3-.75L20 8.47 19.15 7l-1.3.75.85 1.47H17v1.5h1.7l-.85 1.48 1.3.75.85-1.48.85 1.48 1.3-.75-.85-1.48H23z"></path></svg></span></div>
<h1 id="receiving-title">Use a setup code</h1><p id="receiving-guidance">Enter the code shown on your other computer or browser.</p>
<form id="receiving-form" class="setup-form" hidden><label for="receiving-code">Code from the other computer or browser</label>
<input id="receiving-code" class="setup-field setup-code-field" maxlength="16" autocomplete="off" spellcheck="false" required>
<div class="setup-actions"><button id="receiving-submit" type="submit">Continue</button></div></form>
<div id="receiving-actions" class="setup-actions"></div>
<p id="receiving-status" class="task-status" data-tone="progress" role="status" aria-live="polite">Getting ready for your code…</p>
</section></main><script type="module" src="./main.js"></script></body></html>
