<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Use a setup code</title></head>
<body><header class="setup-header"><span class="setup-brand">Conversation Analytics</span></header>
<main class="setup-main"><section class="setup-card" aria-labelledby="receiving-title">
<h1 id="receiving-title">Use a setup code</h1><p id="receiving-status" role="status" aria-live="polite">Opening receiving session…</p>
<form id="receiving-form" class="setup-form" hidden><label for="receiving-code">Code from the other computer or browser</label>
<input id="receiving-code" class="setup-field" maxlength="16" autocomplete="off" spellcheck="false" required>
<div class="setup-actions"><button id="receiving-submit" type="submit">Continue</button></div></form>
<div id="receiving-actions" class="setup-actions"></div>
</section></main><script type="module" src="./main.js"></script></body></html>
